<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> مجموعه پروشی اسب اریا طابی</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>به سایت اریا طابی خوش امدید</h1>
            <img src="images/ariat.png" width="100px" height="100px"   >
        </div>
    </header>

    <section class="about-me">
        <div class="container">
            <h2>درباره من</h2>
            <p>سلام! من [نام شما] هستم و این سایت برای معرفی خودم است.</p>
        </div>
    </section>

    <!-- گالری اول -->
    <section class="gallery">
        <div class="">
            <h2>سیلمی های مجموعه</h2>
            <div class="gallery-images">
                <img src="images/aria.png" alt="عکس 1">
               
             
            </div>
        </div>
    </section>

    <!-- گالری دوم -->
    <section class="gallery second-gallery">
        <div class="container">
            <h2>تولیدات</h2>
            <div class="gallery-images">
                <img src="images/photo_۲۰۲۵-۰۲-۰۵_۱۷-۱۰-۳۵.jpg" alt="عکس 4">
                <img src="images/تولیدات .jpg" alt="عکس 5">
                <img src="photo6.jpg" alt="عکس 6">
                <img src="photo7.jpg" alt="عکس 7"
            </div>
        </div>
    </section>

    <section class="social-links">
        <div class="container">
            <h2>لینک‌های اجتماعی</h2>
            <div class="icons">
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>تمامی حقوق محفوظ است.</p>
        </div>
    </footer>
</body>
</html>
<style>
    /* تنظیمات اولیه */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background-color: #f9f9f9;
    color: #333;
}

.container {
    width: 80%;
    max-width: 1200px;
    margin: 0 auto;
}

/* هدر */
header {
    background: linear-gradient(135deg, #3498db, #2c2b2c);
    padding: 60px 0;
    text-align: center;
    color: white;
    opacity: 0;
    animation: fadeUp 1s forwards;
}

h1 {
    font-size: 3rem;
    font-weight: bold;
}

/* بخش معرفی */
.about-me {
    padding: 40px 0;
    background-color: #fff;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s forwards 0.5s;
}

.about-me h2 {
    font-size: 2rem;
    margin-bottom: 10px;
}

.about-me p {
    font-size: 1.1rem;
    line-height: 1.6;
}

/* گالری عکس */
.gallery {
    padding: 40px 0;
    background-color: #f1f1f1;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s forwards 1s;
}

.gallery h2 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.gallery-images {
    display: flex;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    animation: slideIn 1s forwards 1.5s;
}

.gallery-images img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.gallery-images img:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
}

/* گالری دوم */
.second-gallery {
    background-color: #e0e0e0;
}

.second-gallery h2 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.second-gallery .gallery-images {
    opacity: 0;
    animation: slideIn 1s forwards 2s;
}

.second-gallery .gallery-images img {
    border-radius: 10px;
}

/* لینک‌های اجتماعی */
.social-links {
    padding: 40px 0;
    background-color: #fff;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s forwards 2s;
}

.social-links h2 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.icons a {
    text-decoration: none;
    font-size: 2rem;
    margin: 0 15px;
    color: #333;
    transition: color 0.3s ease, transform 0.3s ease;
}

.icons a:hover {
    color: #3498db;
    transform: scale(1.2);
}

/* فوتر */
footer {
    background-color: #333;
    color: white;
    padding: 20px 0;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s forwards 2.5s;
}

/* انیمیشن‌ها */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(50px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* ریسپانسیو */
@media screen and (max-width: 768px) {
    .gallery-images {
        flex-direction: column;
        gap: 10px;
    }

    .icons a {
        font-size: 1.8rem;
    }
}
.container img {
    width: 200px; /* عرض تصویر */
    height: 200px; /* ارتفاع تصویر */
    object-fit: cover; /* مقیاس دادن تصویر به صورت خودکار */
    border-radius: 50%; /* دایره کردن تصویر */
}

</style>
